spring:
  application:
    name: jobtrackr-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobtrackr}
    username: ${DB_USERNAME:jobtrackr}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  open-api:
    info:
      title: JobTrackr API
      description: "@project.description@"
      version: "@project.version@"

jobtrackr:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 1h
